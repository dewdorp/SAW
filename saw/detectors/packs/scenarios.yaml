# SAW 기본 탐지 묶음 — 공격 흐름(시나리오)
#
# 탐지 하나하나는 "무슨 일이 있었다"이고, 흐름은 "그 일들이 같은 상대에게서 순서대로 이어졌다"입니다.
# 같은 IP가 등장하는 탐지들을 시간순으로 놓고, 아래 단계가 차례로 모두 나타나면 하나의 흐름으로 묶어 보여 줍니다.
#
#   steps:  차례로 나타나야 하는 단계. 각 단계는 탐지의 "단계(stage)"나 "종류(category 앞부분)" 중 하나라도 맞으면 됩니다.
#   success: true 인 단계는 성공 정황이 있는 탐지여야 합니다(시도만 있는 것은 제외).
#   min_risk: 흐름 안에 이 위험도 이상의 탐지가 하나는 있어야 합니다.
# 흐름은 탐지를 대신하지 않습니다. 묶인 탐지는 그대로 남고, 흐름은 "이어서 보라"는 안내입니다.
version: 1

scenarios:
  - id: web_intrusion
    title: 웹 서버 침투 흐름 (탐색 → 취약점 공격 → 웹셸)
    severity: 0.95
    attack: [T1595, T1190, T1505.003]
    min_risk: medium
    steps:
      - {name: 탐색, stages: [RECON, DISCOVERY]}
      - {name: 취약점 공격, stages: [EXPLOITATION, EXECUTION]}
      - {name: 거점 확보(웹셸), stages: [PERSISTENCE]}
    explain: 같은 상대가 서버를 탐색한 뒤 취약점을 공격하고, 이어서 원격 조종 파일(웹셸)을 올리거나 쓴 흔적이 차례로 보입니다. 서버가 이미 장악됐을 가능성이 있는 순서입니다.
    checks:
      - 웹셸로 의심되는 파일을 서버에서 찾아 보존하고, 생성 시각이 공격 시각과 맞는지 확인
      - 웹셸 접근 이후 서버가 외부로 접속했는지, 내부 다른 서버로 접근했는지 확인
      - 서버 격리 여부를 운영 절차에 따라 결정

  - id: recon_then_success
    title: 탐색 뒤 공격 성공 정황 (탐색 → 성공 응답을 받은 공격)
    severity: 0.85
    attack: [T1595, T1190]
    min_risk: medium
    steps:
      - {name: 탐색, stages: [RECON, DISCOVERY]}
      - {name: 성공 응답을 받은 공격, stages: [EXPLOITATION, EXECUTION], success: true}
    explain: 같은 상대가 서버를 탐색한 뒤, 공격 요청에 성공 응답을 받았습니다. 단순 탐색으로 끝나지 않고 취약한 지점을 찾았을 수 있습니다.
    checks:
      - 성공 응답을 받은 요청의 응답 내용·크기를 확인해 실제로 무엇이 실행·노출됐는지 판단
      - 그 뒤 같은 상대의 요청(파일 올리기, 새 경로 접근)을 타임라인에서 확인

  - id: exec_after_exploit
    title: 공격 뒤 서버 명령 실행 (취약점 공격 → 운영체제 명령)
    severity: 0.95
    attack: [T1190, T1059]
    min_risk: medium
    steps:
      - {name: 취약점 공격, stages: [EXPLOITATION]}
      - {name: 명령 실행, categories: [sig.exec], stages: [EXECUTION]}
    explain: 취약점 공격에 이어, 서버에서 실행하려는 운영체제 명령이 담긴 요청이 같은 상대에게서 나왔습니다.
    checks:
      - 명령이 담긴 요청의 응답 코드와 그 시각 서버의 프로세스 실행 기록을 확인
      - 명령에 나온 외부 주소로의 접속 기록을 확인

  - id: account_takeover
    title: 계정 탈취 뒤 정보 조회 (로그인 공격 → 대량·이례적 조회)
    severity: 0.85
    attack: [T1110, T1078, T1213]
    min_risk: medium
    steps:
      - {name: 로그인 공격, stages: [AUTHENTICATION]}
      - {name: 정보 조회, stages: [DATA_ACCESS]}
    explain: 같은 상대가 로그인을 여러 번 시도한 뒤 정보를 대량으로 또는 이례적으로 조회했습니다. 계정이 넘어갔을 수 있는 순서입니다.
    checks:
      - 로그인에 성공한 계정을 확인하고 계정 주인에게 본인 접속 여부를 확인
      - 조회된 정보의 범위(건수·종류)를 확인
      - 해당 계정의 비밀번호 변경과 접속 종료

  - id: webshell_then_outbound
    title: 침투 뒤 외부 통신 (공격·웹셸 → 외부 접속)
    severity: 0.9
    attack: [T1505.003, T1071]
    min_risk: medium
    steps:
      - {name: 침투, stages: [EXPLOITATION, EXECUTION, PERSISTENCE]}
      - {name: 외부 통신, stages: [OUTBOUND]}
    explain: 공격이나 웹셸 흔적이 있은 뒤, 관련 시스템이 외부와 통신한 탐지가 이어졌습니다. 추가 악성 파일을 받거나 원격 조종 서버와 연결됐을 수 있습니다.
    checks:
      - 외부 통신의 목적지와 주기, 전송량을 확인
      - 해당 내부 시스템에서 통신을 일으킨 프로그램을 확인

  - id: delivery_then_outbound
    title: 악성 파일 유입 뒤 외부 통신
    severity: 0.9
    attack: [T1105, T1071]
    min_risk: medium
    steps:
      - {name: 파일 유입, stages: [DELIVERY]}
      - {name: 외부 통신, stages: [OUTBOUND]}
    explain: 의심스러운 파일이 내려온 뒤 같은 시스템이 외부와 통신했습니다. 받은 파일이 실행됐을 수 있습니다.
    checks:
      - 받은 파일의 해시로 내부 위협 정보·백신 결과를 조회
      - 해당 시스템에서 그 파일의 실행 여부를 확인

  - id: discovery_then_data
    title: 탐색 뒤 대량 조회 (경로 탐색 → 정보 대량·순차 조회)
    severity: 0.8
    attack: [T1595.003, T1213]
    min_risk: medium
    steps:
      - {name: 탐색, stages: [RECON, DISCOVERY]}
      - {name: 정보 조회, stages: [DATA_ACCESS]}
    explain: 같은 상대가 경로를 탐색한 뒤 정보를 대량으로 또는 번호를 바꿔 가며 조회했습니다. 조회 가능한 지점을 찾아 자료를 긁어 가는 순서입니다.
    checks:
      - 조회된 대상(고객 번호 범위 등)과 응답 내용으로 실제 노출 여부를 판단
      - 해당 기능의 권한 검사와 요청 속도 제한을 점검

  - id: lateral_after_access
    title: 침투 뒤 내부 확산 (공격·로그인 → 내부 이동)
    severity: 0.9
    attack: [T1021, T1570]
    min_risk: medium
    steps:
      - {name: 침투·로그인, stages: [EXPLOITATION, EXECUTION, PERSISTENCE, AUTHENTICATION]}
      - {name: 내부 이동, stages: [LATERAL]}
    explain: 침투나 로그인 공격 흔적이 있은 뒤, 관련 시스템에서 내부 다른 시스템으로 향하는 이동 정황이 이어졌습니다.
    checks:
      - 이동 대상 시스템의 로그인 기록과 새로 생긴 계정·작업을 확인
      - 출발 시스템의 격리 여부를 운영 절차에 따라 결정

  - id: internal_admin_sequence
    title: 이례 포트 연결 뒤 내부 관리 접속 가능성
    severity: 0.65
    attack: [T1021]
    min_risk: low
    max_span_seconds: 14400
    entity_role: source
    strict_order: true
    steps:
      - {name: 포트 기준 밖 연결, categories: [ndr.unexpected_port]}
      - {name: 내부 관리 접속, categories: [ndr.internal_admin]}
    explain: 같은 내부 출발지에서 포트 기준 밖 연결 후 내부 관리 접속이 관측된 연관 후보입니다. 승인된 관리 작업일 수 있으며 인증 성공·원격 실행을 확정하지 않습니다.
    checks: [출발지가 승인된 관리 단말인지 확인, 목적지별 인증 성공·세션·프로세스 기록 대조]
    examples:
      - [{category: ndr.unexpected_port, offset: 0, source: 10.8.0.5}, {category: ndr.internal_admin, offset: 60, source: 10.8.0.5}]
    benign:
      - [{category: ndr.unexpected_port, offset: 0, source: 10.8.0.5}, {category: ndr.internal_admin, offset: 60, source: 10.8.0.6}]
      - [{category: ndr.unexpected_port, offset: 0, source: 10.8.0.5}, {category: ndr.internal_admin, offset: 86400, source: 10.8.0.5}]
  - id: collection_then_transfer
    title: 대량 조회 뒤 대량 송신의 자료 반출 가능성
    severity: 0.75
    attack: [T1213, T1041]
    min_risk: low
    max_span_seconds: 14400
    entity_role: source
    strict_order: true
    steps:
      - {name: 조회 관련 흔적, categories: [web.api_enumeration, web.large_response, web.off_hours_sensitive]}
      - {name: 대량 송신, categories: [ndr.large_outbound]}
    explain: 조회 관련 탐지와 이후 대량 송신이 같은 출발지에서 이어진 연관 후보입니다. 조회한 자료가 실제 송신됐는지는 파일·사용자·프로세스 기록으로 확인해야 합니다.
    checks: [조회와 송신의 실제 사용자·장비가 같은지 확인, 승인된 백업·보고·파일전송 업무 여부 확인, 조회 내용과 송신 파일의 연관성 확인]
    examples:
      - [{category: web.api_enumeration, offset: 0, source: 10.8.0.5}, {category: ndr.large_outbound, offset: 600, source: 10.8.0.5}]
    benign:
      - [{category: web.api_enumeration, offset: 0, source: 10.8.0.5}, {category: ndr.large_outbound, offset: 600, source: 10.8.0.6}]
      - [{category: web.api_enumeration, offset: 600, source: 10.8.0.5}, {category: ndr.large_outbound, offset: 0, source: 10.8.0.5}]
  - id: off_hours_admin_transfer
    title: 업무시간 밖 관리 접속 뒤 송신의 내부자 이상 행위 가능성
    severity: 0.7
    attack: [T1021, T1041]
    min_risk: low
    max_span_seconds: 14400
    entity_role: source
    strict_order: true
    steps:
      - {name: 업무시간 밖 관리 접속, categories: [ndr.off_hours_admin]}
      - {name: 대량 송신, categories: [ndr.large_outbound]}
    explain: 같은 내부 출발지에서 업무시간 밖 관리 접속 후 대량 송신이 이어졌습니다. 내부자 행위·계정 도용·승인된 야간 업무 중 무엇인지는 이 자료만으로 구분할 수 없습니다.
    checks: [당직·유지보수·긴급 작업 승인 확인, 계정 주인과 실제 접속 주체를 별도 확인, 전송 대상과 업무 목적 확인]
    examples:
      - [{category: ndr.off_hours_admin, offset: 0, source: 10.8.0.5}, {category: ndr.large_outbound, offset: 300, source: 10.8.0.5}]
    benign:
      - [{category: ndr.off_hours_admin, offset: 0, source: 10.8.0.5}, {category: ndr.large_outbound, offset: 0, source: 10.8.0.5}]
      - [{category: ndr.off_hours_admin, offset: 0, source: 10.8.0.5}, {category: ndr.large_outbound, offset: 36000, source: 10.8.0.5}]
